name: Data Platform retention
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATA_PLATFORM_DATABASE_URL }}
      RETENTION_APPLY: 'true'
      USAGE_RETENTION_DAYS: '365'
      OPERATIONAL_RETENTION_DAYS: '90'
      OAUTH_STATE_RETENTION_DAYS: '7'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Require dedicated retention database credential
        run: test -n "$DATABASE_URL" || { echo "Missing DATA_PLATFORM_DATABASE_URL secret"; exit 1; }
      - run: npx tsx scripts/retention.ts
